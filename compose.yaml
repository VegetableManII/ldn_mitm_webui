services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先在.env中设置至少12位管理密码}
      RELAY_PORT: ${RELAY_PORT:-11544}
      WEB_BIND: 0.0.0.0
      WEB_PORT: 8080
      ALLOWED_CLIENTS: ${ALLOWED_CLIENTS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports:
      - "${RELAY_PORT:-11544}:${RELAY_PORT:-11544}/udp"
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
